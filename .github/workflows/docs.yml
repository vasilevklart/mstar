name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mstar/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Builds the Sphinx Python API reference and publishes it to this repo's
# gh-pages branch. GitHub Pages serves it at http://mstar.stanford.edu/mstar/,
# and mstar-project/m-star-site mirrors it hourly to https://m-star.org/mstar/.
# The guides are the Mintlify site (docs/mintlify/, docs-mintlify.yml).
# Uses the built-in GITHUB_TOKEN: no deploy key or PAT to own, rotate, or expire.
permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the API autosummary imports the package, and conf.py
          # deliberately does not mock torch (PEP 604 annotations break under mocks).
          pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 \
            --index-url https://download.pytorch.org/whl/cpu
          # Base install only, without the GPU-only model extras (flashinfer,
          # transformers, ...). A module that imports one of them at module scope
          # fails to import and gets no API page.
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          commit_message: "docs: publish ${{ github.sha }}"
